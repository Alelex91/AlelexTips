
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NeoTip - AI Betting Oracle</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NeoTip">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050607">
    
    <!-- Splash Screens iOS -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/neon/512/matrix.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon-green: #00FF66; --dark-bg: #050607; }
        html, body { 
            height: 100%;
            width: 100%;
            background-color: var(--dark-bg);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            color: #E8FFF2; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }
        #root {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .glass-morphism { 
            background: rgba(10, 12, 14, 0.92); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(0, 255, 102, 0.1); 
        }
        .neon-text { color: var(--neon-green); text-shadow: 0 0 12px rgba(0, 255, 102, 0.4); }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        button, .clickable {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
            cursor: pointer;
        }
        button:active, .clickable:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }

        /* Fluid full-width container */
        .app-container {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);
        const alphabet = '01ｱｲｳｴｵｶｷｸｹｺ0123456789';
        const fontSize = 16;
        let rainDrops = Array(Math.floor(canvas.width / fontSize)).fill(1);
        const draw = () => {
            ctx.fillStyle = 'rgba(5, 6, 7, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00FF66'; ctx.font = fontSize + 'px monospace';
            rainDrops.forEach((y, i) => {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.985) rainDrops[i] = 0;
                rainDrops[i]++;
            });
        };
        setInterval(draw, 45);
    </script>
</body>
</html>
